# Builds the world's .apworld and the mod's zip from the source and publishes both on the
# Releases page.
#
# To run it: on GitHub open Actions -> Release -> Run workflow.
# The release is tagged mod-<mod version>_world-<world version>; if that tag already exists the
# run stops, so bump one of the two versions first (see "Publishing a release" in README.md).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read the two versions
        id: versions
        run: |
          mod=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' mod/src/MegabonkAP.Plugin/MegabonkAP.Plugin.csproj)
          world=$(python -c "import json; print(json.load(open('manual_megabonk_ap/archipelago.json'))['world_version'])")
          test -n "$mod" && test -n "$world"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "world=$world" >> "$GITHUB_OUTPUT"
          echo "tag=mod-${mod}_world-${world}" >> "$GITHUB_OUTPUT"

      - name: Stop if this release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the mod's or the world's version first."
            exit 1
          fi

      - name: Check the generated data is up to date
        run: |
          python make_data.py
          git diff --exit-code

      - name: Build the .apworld
        run: python build_apworld.py

      - name: Build the mod's zip
        run: python mod/make_package.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versions.outputs.tag }}
          MOD: ${{ steps.versions.outputs.mod }}
          WORLD: ${{ steps.versions.outputs.world }}
        run: |
          cat > notes.md <<EOF
          - \`MegabonkAP-${MOD}.zip\`: the mod. Import it in r2modman or Gale, or install it by hand (see mod/README.md).
          - \`manual_megabonk_ap.apworld\`: the world, version ${WORLD}. Every Megabonk player and whoever generates needs this same file.
          - \`Bonker.yaml\`: a player file to start from.
          EOF
          gh release create "$TAG" \
            "MegabonkAP-${MOD}.zip" \
            manual_megabonk_ap.apworld \
            Bonker.yaml \
            --target "$GITHUB_SHA" \
            --title "MegabonkAP ${MOD}, world ${WORLD}" \
            --notes-file notes.md
